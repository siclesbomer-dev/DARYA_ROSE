<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160b1e">
<title>Для Дари</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px 72px;
    background:
      radial-gradient(ellipse 80% 60% at 50% -20%, #4a1c58 0%, transparent 60%),
      radial-gradient(ellipse 100% 70% at 50% 110%, #3a0f22 0%, transparent 55%),
      radial-gradient(ellipse 90% 70% at 50% -10%, #34143c 0%, #1b0d24 45%, #0a0610 100%);
    color: #f4e7ee;
    font-family: Georgia, "Times New Roman", "PT Serif", serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- звёзды ---------- */
  .sky { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .sky i {
    position: absolute; background: #fff; border-radius: 50%;
    opacity: .45; animation: twinkle 4s ease-in-out infinite;
    box-shadow: 0 0 6px rgba(255,255,255,.9);
  }
  @keyframes twinkle { 0%,100% { opacity: .12; } 50% { opacity: .9; } }

  /* ---------- светлячки ---------- */
  .fireflies { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  .firefly {
    position: absolute; bottom: -20px; border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #ffb3d1 40%, #ff5a8f 100%);
    box-shadow: 0 0 10px #ffa0c0, 0 0 22px #ff6b9d, 0 0 40px rgba(255,100,150,.6);
    opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translate3d(0, 0, 0) scale(.4); opacity: 0; }
    15%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { transform: translate3d(30px, -105vh, 0) scale(1.2); opacity: 0; }
  }

  /* ---------- падающие лепестки ---------- */
  .petals-fall { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  .petal-fall {
    position: absolute; top: -40px; width: 14px; height: 17px;
    background: radial-gradient(ellipse at 50% 90%, #ff9db7, #b5244a 70%);
    border-radius: 50% 50% 45% 45% / 62% 62% 38% 38%;
    box-shadow: 0 0 8px rgba(255,120,160,.5);
    opacity: 0; animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translate3d(0,-10vh,0) rotate(0deg); opacity: 0; }
    12%  { opacity: .9; }
    100% { transform: translate3d(70px, 112vh, 0) rotate(720deg); opacity: 0; }
  }

  /* ---------- сцена ---------- */
  .scene {
    position: relative;
    width: min(430px, 92vw);
    padding-top: 290px;
    perspective: 1500px;
    z-index: 2;
  }

  /* ---------- роза ---------- */
  .rose-wrap {
    position: absolute; left: 50%; top: 0;
    width: 240px; height: 380px; margin-left: -120px;
    z-index: 1;
  }

  /* пульсирующий ореол */
  .rose-glow {
    position: absolute; left: 50%; top: 100px;
    width: 340px; height: 340px;
    margin-left: -170px; margin-top: -170px;
    background: radial-gradient(circle,
      rgba(255,140,180,.42) 0%,
      rgba(255,80,130,.20) 32%,
      rgba(200,30,90,.08) 55%,
      transparent 72%);
    border-radius: 50%;
    filter: blur(14px);
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    animation: glowPulse 4.5s 0.6s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: .75; transform: scale(1); }
    50%      { opacity: 1;  transform: scale(1.18); }
  }

  /* вращающиеся лучи */
  .rays {
    position: absolute; left: 50%; top: 100px;
    width: 380px; height: 380px;
    margin-left: -190px; margin-top: -190px;
    background: conic-gradient(from 0deg,
      transparent 0deg,
      rgba(255,180,210,.16) 12deg,
      transparent 24deg,
      transparent 60deg,
      rgba(255,180,210,.12) 72deg,
      transparent 84deg,
      transparent 130deg,
      rgba(255,180,210,.14) 142deg,
      transparent 154deg,
      transparent 200deg,
      rgba(255,180,210,.10) 212deg,
      transparent 224deg,
      transparent 280deg,
      rgba(255,180,210,.13) 292deg,
      transparent 304deg);
    border-radius: 50%;
    filter: blur(2px);
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    animation:
      raysIn 2s 0.5s ease forwards,
      raysRotate 40s 1s linear infinite;
  }
  @keyframes raysIn { to { opacity: .65; } }
  @keyframes raysRotate { to { transform: rotate(360deg); } }

  /* искры вокруг розы */
  .sparkles {
    position: absolute; left: 50%; top: 100px;
    width: 0; height: 0;
    pointer-events: none;
    z-index: 6;
  }
  .sparkle {
    position: absolute; width: 4px; height: 4px; margin: -2px 0 0 -2px;
    background: #fff; border-radius: 50%;
    box-shadow: 0 0 6px #fff, 0 0 14px #ff8fbb, 0 0 24px rgba(255,100,150,.6);
    opacity: 0;
    animation: sparkleAnim 3s ease-in-out infinite;
  }
  @keyframes sparkleAnim {
    0%, 100% { opacity: 0; transform: scale(.2); }
    50%      { opacity: 1; transform: scale(1.5); }
  }

  .rose { position: relative; width: 100%; height: 100%; }

  /* стебель */
  .stem {
    position: absolute; left: 50%; bottom: 0;
    width: 9px; height: 210px; margin-left: -4.5px;
    background: linear-gradient(90deg, #163821, #4f9f58 45%, #163821);
    border-radius: 6px 6px 3px 3px;
    transform-origin: bottom center;
    transform: scaleY(0);
    animation: growStem 1.3s .25s cubic-bezier(.2,.8,.3,1) forwards;
    box-shadow: 0 0 8px rgba(100,200,120,.3);
  }
  @keyframes growStem { to { transform: scaleY(1); } }

  /* шипы */
  .thorn {
    position: absolute; left: 50%;
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    opacity: 0;
    filter: drop-shadow(0 0 2px rgba(0,0,0,.5));
    animation: thornIn .5s ease forwards;
  }
  .thorn-1 {
    bottom: 175px; margin-left: 2px;
    border-bottom: 12px solid #3d7a45;
    transform-origin: left center;
    transform: rotate(40deg) scale(0);
    animation-delay: 1.3s;
  }
  .thorn-2 {
    bottom: 120px; margin-left: -12px;
    border-bottom: 10px solid #347040;
    transform-origin: right center;
    transform: rotate(-40deg) scale(0);
    animation-delay: 1.5s;
  }
  @keyframes thornIn {
    to { opacity: 1; }
  }
  .thorn-1 { animation-name: thornIn1; }
  @keyframes thornIn1 { to { opacity: 1; transform: rotate(40deg) scale(1); } }
  .thorn-2 { animation-name: thornIn2; }
  @keyframes thornIn2 { to { opacity: 1; transform: rotate(-40deg) scale(1); } }

  /* листья */
  .leaf {
    position: absolute; left: 50%;
    width: 78px; height: 36px; opacity: 0;
    background: linear-gradient(135deg, #6cc274, #1d4a28 80%);
    box-shadow: inset 0 0 16px rgba(0,0,0,.35), 0 0 12px rgba(100,200,120,.25);
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.3));
  }
  .leaf-l {
    bottom: 150px; margin-left: -76px;
    border-radius: 100% 0 100% 0 / 100% 0 100% 0;
    animation: leafInL .9s 1.05s cubic-bezier(.2,.8,.3,1) forwards;
  }
  .leaf-r {
    bottom: 95px;
    border-radius: 0 100% 0 100% / 0 100% 0 100%;
    animation: leafInR .9s 1.3s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes leafInL {
    from { opacity: 0; transform: rotate(-16deg) scale(.15); }
    to   { opacity: .95; transform: rotate(-16deg) scale(1); }
  }
  @keyframes leafInR {
    from { opacity: 0; transform: rotate(18deg) scale(.15); }
    to   { opacity: .95; transform: rotate(18deg) scale(1); }
  }

  /* голова розы */
  .head {
    position: absolute; left: 50%; top: 0;
    width: 200px; height: 200px; margin-left: -100px;
    transform-origin: 50% 100%;
    animation:
      sway 7s 3s ease-in-out infinite alternate,
      headGlow 4s 3s ease-in-out infinite;
    filter: drop-shadow(0 0 22px rgba(255,100,140,.55))
            drop-shadow(0 0 44px rgba(255,60,120,.28));
  }
  @keyframes sway {
    from { transform: rotate(-1.6deg); }
    to   { transform: rotate(1.6deg); }
  }
  @keyframes headGlow {
    0%, 100% {
      filter: drop-shadow(0 0 18px rgba(255,100,140,.45))
              drop-shadow(0 0 40px rgba(255,60,120,.22));
    }
    50% {
      filter: drop-shadow(0 0 30px rgba(255,120,160,.75))
              drop-shadow(0 0 60px rgba(255,80,140,.45));
    }
  }

  .petal {
    position: absolute; left: 50%; top: 50%;
    transform-origin: 50% 100%;
    border-radius: 50% 50% 46% 46% / 62% 62% 38% 38%;
    box-shadow:
      inset 0 -12px 20px rgba(60,0,20,.55),
      inset 0 10px 16px rgba(255,255,255,.28),
      0 0 14px rgba(255,80,140,.45);
    will-change: transform;
    backface-visibility: hidden;
    animation: petalBreath 5s ease-in-out infinite;
  }
  @keyframes petalBreath {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.12); }
  }

  /* центр розы */
  .rose-center {
    position: absolute; left: 50%; top: 50%;
    width: 22px; height: 22px;
    margin-left: -11px; margin-top: -11px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #ffd4e0 0%, #ff7096 30%, #8b1f3f 100%);
    box-shadow:
      inset 0 0 8px rgba(0,0,0,.5),
      0 0 18px rgba(255,140,180,.9),
      0 0 32px rgba(255,100,150,.6);
    z-index: 20;
    opacity: 0;
    animation: centerIn 1s 1.6s ease forwards, centerPulse 3s 2.6s ease-in-out infinite;
  }
  @keyframes centerIn { to { opacity: 1; } }
  @keyframes centerPulse {
    0%, 100% { transform: scale(1); box-shadow: inset 0 0 8px rgba(0,0,0,.5), 0 0 18px rgba(255,140,180,.9), 0 0 32px rgba(255,100,150,.6); }
    50%      { transform: scale(1.1); box-shadow: inset 0 0 8px rgba(0,0,0,.5), 0 0 28px rgba(255,160,200,1), 0 0 50px rgba(255,120,170,.85); }
  }

  /* ---------- письмо ---------- */
  .letter {
    position: relative; z-index: 2;
    padding: 34px 30px 30px;
    border-radius: 18px;
    background: linear-gradient(165deg, #fdf7f0 0%, #f7ebdf 55%, #efdfd0 100%);
    color: #3b2a30;
    box-shadow:
      0 34px 70px -22px rgba(0,0,0,.85),
      0 0 0 1px rgba(255,255,255,.55) inset,
      0 1px 0 rgba(255,255,255,.9) inset,
      0 0 40px rgba(255,140,180,.18);
    transform-origin: top center;
    transform: rotateX(-92deg) scale(.96);
    opacity: 0;
    transition:
      transform 1.35s cubic-bezier(.2,.85,.25,1),
      opacity .9s ease;
  }
  .letter.open { transform: rotateX(0) scale(1); opacity: 1; }

  .letter::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle at 50% 0%, rgba(255,255,255,.7), transparent 60%);
    pointer-events: none;
  }

  .to {
    margin: 0 0 18px;
    font-size: 27px;
    font-style: italic;
    color: #8b1f3f;
    letter-spacing: .02em;
    text-shadow: 0 0 18px rgba(255,120,160,.3);
  }

  .body {
    margin: 0 0 22px;
    font-size: 16.5px;
    line-height: 1.78;
    white-space: pre-line;
    min-height: 10em;
  }
  .body.typing::after {
    content: "|";
    display: inline-block;
    margin-left: 2px;
    color: #8b1f3f;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .sign {
    margin: 0;
    text-align: right;
    font-style: italic;
    font-size: 18px;
    color: #8b1f3f;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .8s, transform .8s;
  }
  .sign.show { opacity: 1; transform: translateY(0); }

  /* ---------- кнопка ---------- */
  .open-btn {
    position: absolute;
    left: 50%; top: 348px;
    transform: translate(-50%, 0);
    padding: 15px 44px;
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px;
    background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
    color: #fbeef4;
    font-family: inherit;
    font-size: 15px;
    letter-spacing: .16em;
    text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 5;
    animation: btnPulse 2.6s ease-in-out infinite;
    transition: opacity .5s, transform .5s, background .35s;
  }
  @keyframes btnPulse {
    0%, 100% {
      box-shadow: 0 14px 34px -14px rgba(255,110,160,.85),
                  0 0 0 rgba(255,150,190,0);
    }
    50% {
      box-shadow: 0 14px 34px -14px rgba(255,110,160,1),
                  0 0 24px rgba(255,150,190,.55);
    }
  }
  .open-btn:hover {
    background: linear-gradient(160deg, rgba(255,150,190,.32), rgba(255,255,255,.07));
    transform: translate(-50%, -2px);
    animation-play-state: paused;
  }
  .open-btn:active { transform: translate(-50%, 1px) scale(.98); }
  .open-btn.hide { opacity: 0; pointer-events: none; transform: translate(-50%, 14px); }

  /* ---------- адаптив ---------- */
  @media (max-width: 430px) {
    body { padding: 36px 16px 56px; }
    .scene { padding-top: 236px; }
    .rose-wrap { transform: scale(.78); transform-origin: top center; }
    .letter { padding: 28px 22px 26px; }
    .to { font-size: 24px; }
    .body { font-size: 15.5px; }
    .open-btn { top: 296px; padding: 14px 36px; }
  }
  @media (max-height: 720px) and (min-width: 431px) {
    body { padding: 30px 20px 48px; }
    .scene { padding-top: 236px; }
    .rose-wrap { transform: scale(.8); transform-origin: top center; }
    .open-btn { top: 300px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<div class="sky" id="sky" aria-hidden="true"></div>
<div class="fireflies" id="fireflies" aria-hidden="true"></div>
<div class="petals-fall" id="petalsFall" aria-hidden="true"></div>

<main class="scene" id="scene">

  <div class="rose-wrap" aria-hidden="true">
    <div class="rose-glow"></div>
    <div class="rays"></div>
    <div class="sparkles" id="sparkles"></div>
    <div class="rose" id="rose">
      <div class="stem"></div>
      <div class="thorn thorn-1"></div>
      <div class="thorn thorn-2"></div>
      <div class="leaf leaf-l"></div>
      <div class="leaf leaf-r"></div>
      <div class="head" id="head">
        <div class="rose-center"></div>
      </div>
    </div>
  </div>

  <article class="letter" id="letter">
    <p class="to" id="toLine"></p>
    <p class="body" id="bodyText"></p>
    <p class="sign" id="signLine"></p>
  </article>

  <button class="open-btn" id="openBtn" type="button">Открыть</button>
</main>

<script>
/* =========================================================
   НАСТРОЙКИ
   ========================================================= */
const CONFIG = {
  to:   "Даря",
  from: "лысый",
  speed: 26,
  text:
`Эта роза не завянет.

Пусть каждый твой день начинается с улыбки, а заканчивается спокойствием. Пусть всё, что ты загадала, обязательно сбудется.

Спасибо, что ты есть.`
};

/* =========================  звёзды  ========================= */
(function stars() {
  const sky = document.getElementById('sky');
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('i');
    const size = Math.random() * 2.2 + 1;
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.width = s.style.height = size.toFixed(1) + 'px';
    s.style.animationDelay = (Math.random() * 5).toFixed(2) + 's';
    s.style.animationDuration = (3 + Math.random() * 4).toFixed(2) + 's';
    frag.appendChild(s);
  }
  sky.appendChild(frag);
})();

/* =========================  светлячки  ========================= */
(function fireflies() {
  const box = document.getElementById('fireflies');
  for (let i = 0; i < 18; i++) {
    const f = document.createElement('div');
    f.className = 'firefly';
    const size = (3 + Math.random() * 4).toFixed(1);
    f.style.left = Math.random() * 100 + '%';
    f.style.width = f.style.height = size + 'px';
    f.style.animationDuration = (9 + Math.random() * 9).toFixed(1) + 's';
    f.style.animationDelay = (Math.random() * 12).toFixed(1) + 's';
    box.appendChild(f);
  }
})();

/* =========================  роза  ========================= */
const headEl = document.getElementById('head');
const PETALS = [];

const LAYERS = [
  { n: 10, w: 108, h: 114, hue: 340, sat: 62, lig: 44, delay: 0.00, z: 1  },
  { n: 9,  w: 94,  h: 100, hue: 342, sat: 66, lig: 48, delay: 0.12, z: 2  },
  { n: 8,  w: 80,  h: 86,  hue: 345, sat: 70, lig: 51, delay: 0.24, z: 3  },
  { n: 7,  w: 66,  h: 72,  hue: 347, sat: 73, lig: 54, delay: 0.36, z: 4  },
  { n: 6,  w: 52,  h: 58,  hue: 349, sat: 76, lig: 57, delay: 0.48, z: 5  },
  { n: 5,  w: 40,  h: 46,  hue: 351, sat: 79, lig: 60, delay: 0.60, z: 6  },
  { n: 4,  w: 28,  h: 34,  hue: 352, sat: 82, lig: 63, delay: 0.72, z: 7  }
];

LAYERS.forEach((L, li) => {
  const offset = li * 20;
  for (let i = 0; i < L.n; i++) {
    const angle = offset + (360 / L.n) * i;
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.width  = L.w + 'px';
    p.style.height = L.h + 'px';
    p.style.marginLeft = (-L.w / 2) + 'px';
    p.style.marginTop  = (-L.h) + 'px';
    p.style.zIndex = L.z;
    p.style.background =
      `radial-gradient(ellipse at 50% 100%,
        hsl(${L.hue} ${L.sat}% ${L.lig + 26}%) 0%,
        hsl(${L.hue} ${L.sat}% ${L.lig + 6}%) 38%,
        hsl(${L.hue} ${L.sat}% ${L.lig - 8}%) 72%,
        hsl(${L.hue} ${L.sat}% ${L.lig - 22}%) 100%)`;
    p.style.setProperty('--a', angle + 'deg');
    p.style.transform = 'rotate(var(--a)) scale(.28)';
    p.style.transition = `transform 1.45s cubic-bezier(.18,.9,.25,1.05) ${L.delay}s`;
    p.style.animationDelay = (1 + Math.random() * 4).toFixed(2) + 's';
    headEl.appendChild(p);
    PETALS.push(p);
  }
});

function bloomRose() {
  PETALS.forEach(p => {
    p.style.transform = 'rotate(var(--a)) scale(1)';
  });
}

/* =====================  искры вокруг розы  ===================== */
(function sparkles() {
  const box = document.getElementById('sparkles');
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    const angle = (i / 16) * Math.PI * 2 + Math.random() * 0.4;
    const radius = 100 + Math.random() * 50;
    s.style.left = Math.cos(angle) * radius + 'px';
    s.style.top  = Math.sin(angle) * radius + 'px';
    s.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
    s.style.animationDuration = (2 + Math.random() * 2.5).toFixed(2) + 's';
    const sz = (3 + Math.random() * 3).toFixed(1);
    s.style.width = s.style.height = sz + 'px';
    box.appendChild(s);
  }
})();

/* =====================  падающие лепестки  ===================== */
let petalsStarted = false;
function startFallingPetals() {
  if (petalsStarted) return;
  petalsStarted = true;
  const box = document.getElementById('petalsFall');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'petal-fall';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (9 + Math.random() * 8).toFixed(1) + 's';
    p.style.animationDelay = (Math.random() * 10).toFixed(1) + 's';
    p.style.transform = `scale(${(0.6 + Math.random() * 0.9).toFixed(2)})`;
    box.appendChild(p);
  }
}

/* =====================  печатная машинка  ===================== */
function typeText(el, text, speed, done) {
  el.classList.add('typing');
  let i = 0;
  (function step() {
    el.textContent = text.slice(0, i);
    if (i >= text.length) {
      el.classList.remove('typing');
      if (done) done();
      return;
    }
    const ch = text[i];
    i++;
    let d = speed;
    if (ch === ',')      d = speed * 6;
    else if (ch === '.') d = speed * 11;
    else if (ch === '—') d = speed * 5;
    setTimeout(step, d + Math.random() * 16);
  })();
}

/* =====================  запуск сцены  ===================== */
const openBtn  = document.getElementById('openBtn');
const letterEl = document.getElementById('letter');
const toLine   = document.getElementById('toLine');
const bodyText = document.getElementById('bodyText');
const signLine = document.getElementById('signLine');

toLine.textContent = CONFIG.to + ',';
signLine.textContent = '— ' + CONFIG.from;

let started = false;

function start() {
  if (started) return;
  started = true;

  openBtn.classList.add('hide');
  setTimeout(() => openBtn.remove(), 700);

  bloomRose();
  setTimeout(() => letterEl.classList.add('open'), 1700);
  setTimeout(startFallingPetals, 1900);

  setTimeout(() => {
    typeText(bodyText, CONFIG.text, CONFIG.speed, () => {
      setTimeout(() => signLine.classList.add('show'), 450);
    });
  }, 2900);
}

openBtn.addEventListener('click', start);
setTimeout(() => { if (!started) start(); }, 12000);
</script>
</body>
</html>
